services:
  postgres:
    image: postgres:16
    container_name: postgre_db
    networks:
      - pipedrive_net
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: db_pipedrive
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_pipedrive_postgre:/var/lib/postgresql/data
    restart: always

  cron:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PIPEDRIVE_API_KEY
        - PIPEDRIVE_BASE_URL
        - DB_USER
        - DB_PASSWORD
        - DB_DATABASE
        - TIMEZONE
    container_name: postgre_cron
    networks:
      - pipedrive_net
    env_file:
      - .env
    environment:
      TZ: America/Sao_Paulo
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      - postgres
    restart: always

networks:
  pipedrive_net:
    driver: bridge
    
volumes:
  db_pipedrive_postgre:
    name: db_pipedrive_postgre